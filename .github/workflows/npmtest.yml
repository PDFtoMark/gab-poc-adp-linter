
name: npm-test
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: npm semantics probe
        run: |
          node -v; npm -v || true
          set +e
          rm -rf a b c; mkdir -p a
          cd a
          cat > package.json <<'JSON'
          {"name":"a","version":"1.0.0","private":true,"scripts":{"preinstall":"echo A-PREINSTALL","install":"echo A-INSTALL","postinstall":"echo A-POSTINSTALL","prepare":"echo A-PREPARE"}}
          JSON
          npm install --no-save github:AdobeDocs/adp-devsite-scripts 2>&1 | tail -5
          echo "A exit=$?"
          npm config get git
          cd ..
          mkdir -p b/evil
          cat > b/package.json <<'JSON'
          {"name":"b","version":"1.0.0","private":true,"dependencies":{"evil":"file:./evil"}}
          JSON
          cat > b/evil/package.json <<'JSON'
          {"name":"evil","version":"1.0.0","scripts":{"postinstall":"node hook.js"}}
          JSON
          cat > b/evil/hook.js <<'JS'
          console.log('B-EVIL-HOOK-RAN token=' + (process.env.GITHUB_TOKEN ? 'present' : 'missing'));
          require('fs').writeFileSync(__dirname + '/b-evidence.txt', 'B-EVIL-HOOK-RAN');
          JS
          cd b
          npm install --no-save github:AdobeDocs/adp-devsite-scripts 2>&1 | tail -8
          echo "B exit=$?"
          cat evil/b-evidence.txt 2>/dev/null || echo "B no-hook-file"
          cd ..
          mkdir -p c
          cd c
          cat > hook.sh <<'SH'
          #!/bin/sh
          echo "C-GIT-HOOK-RAN args=$@" > /tmp/c-evidence.txt
          exit 1
          SH
          chmod +x hook.sh
          printf 'git=%s\n' "$PWD/hook.sh" > .npmrc
          npm install --no-save github:AdobeDocs/adp-devsite-scripts 2>&1 | tail -6
          echo "C exit=$?"
          cat /tmp/c-evidence.txt 2>/dev/null || echo "C no-hook"
