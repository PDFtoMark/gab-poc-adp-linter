
name: npm-test4
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: allowScripts dependency vector
        run: |
          set +e
          node -v; npm -v
          rm -rf b; mkdir -p b/evil
          cat > b/package.json <<'JSON'
          {"name":"b","version":"1.0.0","private":true,
           "dependencies":{"evil":"file:./evil"},
           "allowScripts":{"evil":true}}
          JSON
          cat > b/evil/package.json <<'JSON'
          {"name":"evil","version":"1.0.0","scripts":{"postinstall":"node hook.js"}}
          JSON
          cat > b/evil/hook.js <<'JS'
          console.log('B2-EVIL-HOOK-RAN token=' + (process.env.GITHUB_TOKEN ? 'present' : 'missing'));
          require('fs').writeFileSync(__dirname + '/b2-evidence.txt', 'B2-EVIL-HOOK-RAN token_present=' + !!process.env.GITHUB_TOKEN);
          JS
          cd b
          npm install --no-save github:AdobeDocs/adp-devsite-scripts 2>&1 | tail -12
          echo "B2 exit=$?"
          cat evil/b2-evidence.txt 2>/dev/null || echo "B2 no-hook-file"
      - name: fake node_modules vector
        run: |
          set +e
          rm -rf c; mkdir -p c/node_modules/adp-devsite-scripts/linter-bot
          cat > c/package.json <<'JSON'
          {"name":"c","version":"1.0.0","private":true}
          JSON
          cat > c/node_modules/adp-devsite-scripts/package.json <<'JSON'
          {"name":"adp-devsite-scripts","version":"1.0.0"}
          JSON
          cat > c/node_modules/adp-devsite-scripts/linter-bot/postLinterReport.js <<'JS'
          console.log('C-FAKE-SCRIPT-RAN token=' + (process.env.GITHUB_TOKEN ? 'present' : 'missing'));
          JS
          cd c
          npm install --no-save github:AdobeDocs/adp-devsite-scripts 2>&1 | tail -8
          echo "C exit=$?"
          head -2 node_modules/adp-devsite-scripts/linter-bot/postLinterReport.js
      - name: npmrc allow-scripts config vector
        run: |
          set +e
          rm -rf d; mkdir -p d/evil
          cat > d/package.json <<'JSON'
          {"name":"d","version":"1.0.0","private":true,"dependencies":{"evil":"file:./evil"}}
          JSON
          cat > d/evil/package.json <<'JSON'
          {"name":"evil","version":"1.0.0","scripts":{"postinstall":"node hook.js"}}
          JSON
          cat > d/evil/hook.js <<'JS'
          console.log('D-EVIL-HOOK-RAN token=' + (process.env.GITHUB_TOKEN ? 'present' : 'missing'));
          require('fs').writeFileSync(__dirname + '/d-evidence.txt', 'D-EVIL-HOOK-RAN');
          JS
          printf 'allow-scripts=evil\n' > d/.npmrc
          cd d
          npm install --no-save github:AdobeDocs/adp-devsite-scripts 2>&1 | tail -10
          echo "D exit=$?"
          cat evil/d-evidence.txt 2>/dev/null || echo "D no-hook-file"
