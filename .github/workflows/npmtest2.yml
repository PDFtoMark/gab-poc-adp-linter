
name: npm-test2
on:
  workflow_dispatch:
jobs:
  producer:
    runs-on: ubuntu-latest
    steps:
      - name: stage
        run: |
          mkdir -p payload
          cat > payload/hook.sh <<'SH'
          #!/bin/sh
          echo "GIT-HOOK-RAN-FROM-ARTIFACT args=$@" > "$GITHUB_WORKSPACE/evidence.txt"
          exit 1
          SH
          chmod +x payload/hook.sh
          printf 'git=%s/payload/hook.sh\n' "$GITHUB_WORKSPACE" > payload/dotnpmrc
          ls -l payload
      - uses: actions/upload-artifact@v7
        with:
          name: probe
          path: |
            payload/hook.sh
            payload/dotnpmrc
          include-hidden-files: true
  consumer:
    needs: producer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: probe
      - name: inspect
        run: |
          set +e
          echo "workspace=$GITHUB_WORKSPACE"
          find . -maxdepth 3 | head -20
          ls -l payload/hook.sh
          stat -c '%a %n' payload/hook.sh
          test -x payload/hook.sh && echo "EXEC-BIT-PRESERVED" || echo "EXEC-BIT-LOST"
          cp payload/dotnpmrc .npmrc
          npm install --no-save github:AdobeDocs/adp-devsite-scripts 2>&1 | tail -5
          echo "exit=$?"
          cat evidence.txt 2>/dev/null || echo "NO-EVIDENCE"
