name: Lint
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build attacker-controlled linter artifact
        run: |
          echo "${{ github.event.pull_request.number }}" > pr-number.txt
          printf 'CLEAN-POC linter report body' > linter-report.txt
      - name: Upload linter report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            pr-number.txt
            linter-report.txt
            package.json
            poc-evil
          if-no-files-found: ignore
