name: Lint
on:
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Forged linter artifact
        run: |
          mkdir -p out
          printf 'Forged linter report: no issues found.\n' > out/linter-report.txt
          printf '1\n' > out/pr-number.txt
          cat > out/package.json <<'PKG'
          {
            "name": "gab-fork-root",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "gab-poc-linter-dep": "github:PDFtoMark/gab-poc-linter-dep"
            }
          }
          PKG
          printf 'foreground-scripts=true\n' > out/.npmrc
      - name: Upload linter report
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: out/*
          include-hidden-files: true

